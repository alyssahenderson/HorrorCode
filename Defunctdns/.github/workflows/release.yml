name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Binaries
        run: |
          mkdir -p build
          echo "Building for Linux..."
          GOOS=linux GOARCH=amd64 go build -o build/dns-server-linux-amd64 main.go
          echo "Building for Windows..."
          GOOS=windows GOARCH=amd64 go build -o build/dns-server-windows-amd64.exe main.go
          echo "Building for macOS (Intel)..."
          GOOS=darwin GOARCH=amd64 go build -o build/dns-server-darwin-amd64 main.go
          echo "Building for macOS (Apple Silicon)..."
          GOOS=darwin GOARCH=arm64 go build -o build/dns-server-darwin-arm64 main.go

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} build/* --generate-notes
